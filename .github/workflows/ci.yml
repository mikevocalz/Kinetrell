name: CI

on:
  push:
  pull_request:

jobs:
  verify-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use current npm
        run: npm install --global npm@12.2.0

      - name: Resolve lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install
        run: npm ci

      - name: Audit selected npm versions
        run: npm run audit:current

      - name: Verify library
        run: npm run verify

      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: docs/dependency-audit.json
          if-no-files-found: warn

  verify-expo58:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm for Expo preview lane
        run: npm install --global pnpm@12.8.1

      - name: Install Expo SDK 58 fixture
        working-directory: examples/expo58
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck Expo SDK 58 fixture
        working-directory: examples/expo58
        run: pnpm run typecheck

      - name: Upload Expo lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo58-pnpm-lock
          path: examples/expo58/pnpm-lock.yaml
          if-no-files-found: warn

  verify-packed-consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use current npm
        run: npm install --global npm@12.2.0

      - name: Resolve lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install library toolchain
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Verify packed clean consumers
        run: npm run verify:consumers
