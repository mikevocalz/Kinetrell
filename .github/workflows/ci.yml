name: CI

on:
  push:
  pull_request:

jobs:
  verify-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use current npm
        run: npm install --global npm@12.2.0

      - name: Resolve lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install
        run: npm ci

      - name: Audit selected npm versions
        run: npm run audit:current

      - name: Verify library
        run: npm run verify

      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: docs/dependency-audit.json
          if-no-files-found: warn

  verify-expo58:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm for Expo preview lane
        run: npm install --global pnpm@12.8.1

      - name: Install Expo SDK 58 fixture
        working-directory: examples/expo58
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck Expo SDK 58 fixture
        working-directory: examples/expo58
        run: pnpm run typecheck

      - name: Upload Expo lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo58-pnpm-lock
          path: examples/expo58/pnpm-lock.yaml
          if-no-files-found: warn

  verify-native-performance-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use current npm and pnpm
        run: |
          npm install --global npm@12.2.0
          npm install --global pnpm@12.8.1

      - name: Install and build Kinetrell
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run build

      - name: Run host compiler/evaluator benchmark
        run: node benchmarks/core.mjs

      - name: Install native performance fixture
        working-directory: examples/native-performance
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck native performance fixture
        working-directory: examples/native-performance
        run: ./node_modules/.bin/tsc --noEmit

      - name: Upload host benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: kinetrell-host-core-benchmark
          path: benchmarks/results/host-core.json
          if-no-files-found: error

  verify-semantic-parallax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm for Expo preview lane
        run: npm install --global pnpm@12.8.1

      - name: Build Kinetrell for local fixture dependency
        run: |
          npm install --global npm@12.2.0
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run build

      - name: Install semantic parallax fixture
        working-directory: examples/parallax-anchors
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck semantic parallax fixture
        working-directory: examples/parallax-anchors
        run: ./node_modules/.bin/tsc --noEmit

      - name: Export semantic parallax web build
        working-directory: examples/parallax-anchors
        run: ./node_modules/.bin/expo export --platform web --output-dir dist-web

      - name: Upload semantic parallax lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-parallax-pnpm-lock
          path: examples/parallax-anchors/pnpm-lock.yaml
          if-no-files-found: warn

  verify-web-showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use current npm
        run: npm install --global npm@12.2.0

      - name: Install library dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci

      - name: Install showcase dependencies
        working-directory: examples/web
        run: npm install --ignore-scripts

      - name: Verify Vite showcase
        working-directory: examples/web
        run: npm run verify

  verify-packed-consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use current npm
        run: npm install --global npm@12.2.0
      - name: Resolve lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install library toolchain
        run: npm ci
      - name: Build package
        run: npm run build
      - name: Verify packed clean consumers
        run: npm run verify:consumers

  verify-next-ssr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use current npm
        run: npm install --global npm@12.2.0

      - name: Install and build Kinetrell
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run build

      - name: Install Next.js SSR fixture
        working-directory: examples/next-ssr
        run: npm install --ignore-scripts

      - name: Install Chromium
        working-directory: examples/next-ssr
        run: npx playwright install --with-deps chromium

      - name: Verify SSR and hydration
        working-directory: examples/next-ssr
        run: npm run test:e2e
